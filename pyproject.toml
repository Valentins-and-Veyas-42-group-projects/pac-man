[project]
name = "pacman"
version = "0.1.0"
description = "A Pac-Man recreation built for the 42 curriculum."
requires-python = ">=3.11"
dependencies = [
    "cli-fw>=0.0.4",
    "fsnotify-python>=0.0.2",
    "pygame>=2.5",
    "python-crimes>=0.0.5,<1",
    "sqlite-callback-store>=0.0.4",
    "typed-errs>=0.0.4",
    "typed-file-io>=0.0.4",
    "typed-concurrency>=0,<1",
]

[dependency-groups]
dev = ["flake8", "mypy", "pytest", "ruff"]

[project.scripts]
pacman = "pacman.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pacman*"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 79

[tool.ruff]
line-length = 100
target-version = "py310"
preview = true
src = ["pacman"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
